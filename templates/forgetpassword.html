<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='forgetpassword.css') }}">
</head>
<body>
<div class="container">
    <div class="panel panel-default text-center">
        <div class="panel-body">
            <h4><i class="fa fa-lock fa-4x"></i></h4>
            <h2>Forgot Password?</h2>
            <p>You can reset your password here.</p>

            <form id="register-form" role="form" autocomplete="off" class="form" method="post" action="{{ url_for('forgetpassword') }}">
                <div class="form-group">
                    <div class="input-group">
                        <span class="input-group-addon">
                            <i class="glyphicon glyphicon-envelope color-blue"></i>
                        </span>
                        <input id="email" name="email" placeholder="Email address" class="form-control" type="email" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
                <input type="hidden" class="hide" name="token" id="token" value="">
            </form>
        </div>
    </div>
</div>
</body>
</html>
