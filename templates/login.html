<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <img src="{{ url_for('static', filename='Balance2.png') }}" width="25" height="30" alt="Logo">

                <span>
                    <a href="{{ url_for('home') }}" style="color: black; text-decoration: none;">
                        KnowYourLaw
                    </a>
                </span>
            </div>
            <div class="hamburger" onclick="toggleMenu()">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <div class="imgcontainer">
        <img src="{{ url_for('static', filename='Adobe Express - file.png') }}" alt="Avatar" class="avatar">
    </div>

    <!-- ✅ Added form -->
    <form action="{{ url_for('login') }}" method="post">
        <div class="container">
            <label for="uname"><b>Username:</b></label>
            <input type="text" placeholder="Enter Username" name="username" required>

            <label for="psw"><b>Password:</b></label>
            <input type="password" placeholder="Enter Password" name="password" required>

            <label>
                <input type="checkbox" checked="checked" name="remember"> Remember me
            </label>

            <button type="submit">Login</button>
            <button type="button" class="cancelbtn">Cancel</button>

            <span class="psw">Forgot? <a href="{{ url_for('forgetpassword') }}">Password</a></span>
            <span class="su">New User? <a href="{{ url_for('signup') }}">Sign Up</a></span>
        </div>
    </form> 
</body>
</html>
